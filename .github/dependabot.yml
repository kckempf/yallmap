version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Track the Node major we run on; bump deliberately with the runtime
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      opentelemetry:
        patterns:
          - "@opentelemetry/*"
        update-types:
          - major
          - minor
          - patch
      hono:
        patterns:
          - "hono"
          - "@hono/*"
        update-types:
          - major
          - minor
          - patch
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types:
          - major
          - minor
          - patch
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
